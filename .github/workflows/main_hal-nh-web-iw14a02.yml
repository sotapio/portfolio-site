# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - hal-nh-web-iw14a02

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      # 1. Node.js環境のセットアップ（Azureのバージョン v24.15.0 に合わせています）
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 安定版のNode 20を指定（必要に応じて22や24に変更可能）
          cache: 'npm'

      # 2. パッケージのインストールとNext.jsのビルド
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      # 3. ビルドされた成果物を一時保存（アップロード）
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      # 4. ビルド成果物のダウンロード
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_83C308FCC7924250B14A9B4DF1FBEF72 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AF8EC5E60A154CADA957EF38142E6749 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_34C388CBB3FF4409B8764693F88DF40F }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'hal-nh-web-iw14a02'
          slot-name: 'Production'
          package: .
